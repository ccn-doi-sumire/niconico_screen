<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Test</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6a7282;
    --line: #dde1e8;
    --accent: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181e;
      --card: #1e232b;
      --text: #e8ebf0;
      --muted: #9aa3b2;
      --line: #313844;
      --accent: #8ab4f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .reactions { display: flex; flex-wrap: wrap; gap: 8px; }
  .reactions button { font-size: 24px; padding: 6px 10px; line-height: 1.2; }
  #status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <h1>オーバーレイ送信テスト</h1>
  <p>Meet を使わずに、デスクトップにコメントとリアクションが流れるか確かめるページです。</p>
  <div class="card">
    <form id="f">
      <input id="t" placeholder="コメントを入力" autocomplete="off" autofocus>
      <button class="primary">送信</button>
    </form>
  </div>
  <div class="card">
    <div class="reactions" id="r"></div>
    <div style="margin-top:12px"><button id="burst" type="button">👏 を 20 回連打</button></div>
  </div>
  <div id="status"></div>
</main>
<script>
  const status = document.getElementById('status');
  async function send(events) {
    try {
      const res = await fetch('/event', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(events) });
      const j = await res.json();
      status.textContent = j.paused ? '送信しました（オーバーレイは一時停止中です）' : '送信しました';
    } catch (e) {
      status.textContent = '送信できませんでした: ' + e;
    }
  }
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('t');
    if (!input.value.trim()) return;
    send([{ type: 'comment', text: input.value, author: 'テスト' }]);
    input.value = '';
  });
  for (const emoji of ['💖', '👍', '🎉', '👏', '😂', '😮', '😢', '🤔', '👎']) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = emoji;
    b.addEventListener('click', () => send([{ type: 'reaction', emoji }]));
    document.getElementById('r').appendChild(b);
  }
  document.getElementById('burst').addEventListener('click', () => {
    for (let i = 0; i < 20; i++) setTimeout(() => send([{ type: 'reaction', emoji: '👏' }]), i * 90);
  });
</script>
</body>
</html>
